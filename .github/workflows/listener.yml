name: Track New Uploads

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Listener
        env:
          MUSIC_BOT_TOKEN: ${{ secrets.MUSIC_BOT_TOKEN }}
          MUSIC_CHANNEL_ID: ${{ secrets.MUSIC_CHANNEL_ID }}
        run: python scripts/music_listener.py
        
      - name: Commit raw state and log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f music_state.json daily_log.json || true
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(listener): track new uploads and update state ($(date +'%Y-%m-%d'))"
            git pull --rebase origin main
            git push
          fi