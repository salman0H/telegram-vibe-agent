name: Daily AI Vibe Curator

on:
  schedule:
    - cron: '30 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: pip install --upgrade google-generativeai
        
      - name: Run AI Curator
        env:
          MUSIC_BOT_TOKEN: ${{ secrets.MUSIC_BOT_TOKEN }}
          MUSIC_CHANNEL_ID: ${{ secrets.MUSIC_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.MUSIC_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.MUSIC_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/daily_ai_curator.py
        
      - name: Commit raw state and log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f daily_log.json || true
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily log queue after curation"
            git pull --rebase origin main || true
            git push
          fi